services:
  - type: web
    name: manchas-piloto
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manchas-piloto-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "[]"
      - key: MANCHAS_BUSINESS_NAME
        value: Manchas Piloto
      - key: MANCHAS_BUSINESS_SLUG
        value: manchas-piloto
      - key: MANCHAS_OWNER_EMAIL
        sync: false
      - key: MANCHAS_OWNER_PASSWORD
        generateValue: true

databases:
  - name: manchas-piloto-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    ipAllowList: []
